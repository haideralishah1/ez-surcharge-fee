# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "dac75cbbc1580b6126dbeac81c4d6cf8"
application_url = "https://example.com"
embedded = true
name = "ez Surcharge fee"

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
scopes = "write_products,write_cart_transforms,read_publications,write_publications,write_validations,read_orders,write_orders,read_locales,read_merchant_managed_fulfillment_orders,write_merchant_managed_fulfillment_orders"

[webhooks]
api_version = "2026-10"

  # Handled by: /app/routes/webhooks.orders.create.tsx
  [[webhooks.subscriptions]]
  uri = "/webhooks/orders/create"
  topics = ["orders/create"]

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/uninstalled"
  topics = [ "app/uninstalled" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/scopes_update"
  topics = [ "app/scopes_update" ]

[auth]
redirect_urls = [ "https://example.com/api/auth" ]

[build]
include_config_on_deploy = true
automatically_update_urls_on_dev = true
